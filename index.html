            const EI = scores.E >= scores.I ? 'E' : 'I';
            const SN = scores.S >= scores.N ? 'S' : 'N';
            const TF = scores.T >= scores.F ? 'T' : 'F';
            const JP = scores.J >= scores.P ? 'J' : 'P';
            const typeCode = EI + SN + TF + JP;
            return RESULT_TYPES.find(t => t.code === typeCode) || RESULT_TYPES[0];
        }

        // 渲染首页
        function renderHome() {
            app.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8">
                        <div class="card card-test p-4 p-md-5 text-center">
                            <div class="mb-4 display-1">🧔‍♂️</div>
                            <h1 class="display-5 fw-bold mb-3">MBTI已经过时，BoyTI来了。</h1>
                            <p class="lead mb-4">20道精选题目，测测你是爹味重还是纯爱战士？</p>
                            <button id="startBtn" class="btn btn-gradient btn-lg px-5 py-3 mt-3">开始测试 <i class="bi bi-arrow-right ms-2"></i></button>
                            <p class="footer-note mt-5 small"><i class="bi bi-chat-quote"></i> 别想太多，凭直觉选最像你的那个。</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('startBtn').addEventListener('click', () => {
                currentView = 'quiz';
                answers = {};
                renderQuiz();
            });
        }

        // 渲染答题页
        function renderQuiz() {
            let questionsHtml = '';
            QUESTION_BANK.forEach((q, idx) => {
                const selectedIdx = answers[q.id] !== undefined ? answers[q.id] : -1;
                let optionsHtml = '';
                q.options.forEach((opt, optIdx) => {
                    const selectedClass = (selectedIdx === optIdx) ? 'selected' : '';
                    optionsHtml += `<button class="option-btn btn ${selectedClass}" data-qid="${q.id}" data-optindex="${optIdx}"><span class="me-2 fw-bold">${String.fromCharCode(65 + optIdx)}.</span> ${opt.text}</button>`;
                });
                questionsHtml += `<div class="question-card"><h5 class="fw-semibold mb-3">${idx+1}. ${q.text}</h5><div class="d-grid gap-2">${optionsHtml}</div></div>`;
            });
            const answeredCount = Object.keys(answers).length;
            const progressPercent = (answeredCount / QUESTION_BANK.length) * 100;
            app.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8">
                        <div class="card card-test p-4 p-md-5">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <h3 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i>答题卡</h3>
                                <span class="badge rounded-pill px-4 py-2">${answeredCount}/${QUESTION_BANK.length} 题</span>
                            </div>
                            <div class="progress mb-4" style="height:8px">
                                <div class="progress-bar bg-primary" style="width:${progressPercent}%"></div>
                            </div>
                            <div id="questionsContainer">${questionsHtml}</div>
                            <div class="d-grid mt-4">
                                <button id="submitQuizBtn" class="btn btn-gradient btn-lg py-3">查看结果 <i class="bi bi-bar-chart-fill ms-2"></i></button>
                            </div>
                            <button id="backHomeBtn" class="btn btn-link text-secondary mt-3"><i class="bi bi-arrow-left"></i> 返回首页</button>
                        </div>
                    </div>
                </div>
            `;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    answers[btn.dataset.qid] = parseInt(btn.dataset.optindex);
                    renderQuiz();
                });
            });

            document.getElementById('submitQuizBtn').addEventListener('click', () => {
                if (Object.keys(answers).length < QUESTION_BANK.length) {
                    alert(`还有 ${QUESTION_BANK.length - Object.keys(answers).length} 题未答`);
                    return;
                }
                finalType = calculateResult();
                currentView = 'result';
                renderResult();
            });

            document.getElementById('backHomeBtn').addEventListener('click', () => {
                currentView = 'home';
                renderHome();
            });
        }

        // 渲染结果页 (包含原特质、梗名、副标题、梗解释)
        async function renderResult() {
            const type = finalType;
            const isDark = document.body.getAttribute('data-bs-theme') === 'dark';
            
            app.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-12 col-md-10 col-lg-8">
                        <div id="resultCard" class="card card-test p-4 p-md-5 text-center">
                            <div class="result-avatar" style="background: radial-gradient(circle at 30% 30%, ${type.avatarColor}dd, ${type.avatarColor}99);">
                                <span class="display-3">${type.avatarEmoji}</span>
                            </div>
                            
                            <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                                <span class="badge-type">${type.code}</span>
                                <span class="text-secondary">· ${type.originalTrait}</span>
                            </div>
                            
                            <h2 class="fw-bold mb-1">${type.name}</h2>
                            <p class="fs-5 text-secondary mb-3">「${type.subtitle}」</p>
                            
                            <div class="meme-explain text-start mb-4">
                                <i class="bi bi-chat-quote-fill me-1"></i> ${type.description.split('。')[0]}。
                            </div>
                            
                            <div class="bg-light bg-opacity-25 p-4 rounded-4 mb-4" style="background: ${isDark ? '#1e293b' : '#f8fafc'}">
                                <p class="lead mb-0">${type.description}</p>
                            </div>
                            
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <div class="p-3 rounded-4 h-100" style="background: ${isDark ? '#1e293b' : '#f1f5f9'}">
                                        <div class="text-secondary small">直男指数</div>
                                        <div class="display-6 fw-bold text-primary">${type.traits.straightScore}%</div>
                                        <div class="small">${type.traits.straightComment}</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="p-3 rounded-4 h-100" style="background: ${isDark ? '#1e293b' : '#f1f5f9'}">
                                        <div class="text-secondary small">情商潜力</div>
                                        <div class="display-6 fw-bold text-success">${type.traits.eqScore}%</div>
                                        <div class="small">${type.traits.eqComment}</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex flex-wrap gap-3 justify-content-center">
                                <button id="shareBtn" class="btn btn-gradient px-4 py-2">
                                    <i class="bi bi-download me-2"></i>保存结果卡片
                                </button>
                                <button id="retakeBtn" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                                    <i class="bi bi-arrow-repeat me-2"></i>重新测试
                                </button>
                            </div>
                            <p class="footer-note small mt-4">* 测试结果仅供娱乐，每个直男都是潜力股。</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('retakeBtn').addEventListener('click', () => {
                currentView = 'home';
                answers = {};
                renderHome();
            });

            document.getElementById('shareBtn').addEventListener('click', async () => {
                const btn = document.getElementById('shareBtn');
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>生成中...';
                btn.disabled = true;
                try {
                    const el = document.getElementById('resultCard');
                    const bgColor = document.body.getAttribute('data-bs-theme') === 'dark' ? '#192132' : '#ffffff';
                    el.style.background = bgColor;
                    const canvas = await html2canvas(el, { scale: 2.2, backgroundColor: bgColor });
                    el.style.background = '';
                    const link = document.createElement('a');
                    link.download = `BoyTi-${type.code}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.innerHTML = '<i class="bi bi-check-lg me-2"></i>已保存';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="bi bi-download me-2"></i>保存结果卡片';
                        btn.disabled = false;
                    }, 2000);
                } catch(e) {
                    alert('生成失败，可截图保存');
                    btn.innerHTML = '<i class="bi bi-download me-2"></i>保存结果卡片';
                    btn.disabled = false;
                }
            });
        }

        // 启动
        renderHome();
    })();
</script>
</body>
</html>
