        // 计算结果类型

            let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
            answers.forEach(ans => {
                const q = QUESTION_BANK.find(q => q.id === ans.questionId);
                if (!q) return;
                const option = q.options[ans.optionIndex];
                if (option && option.trait) {
                    scores[option.trait] += option.weight || 1;
                }
            });
            const EI = scores.E >= scores.I ? 'E' : 'I';
            const SN = scores.S >= scores.N ? 'S' : 'N';
            const TF = scores.T >= scores.F ? 'T' : 'F';
            const JP = scores.J >= scores.P ? 'J' : 'P';
            const typeCode = EI + SN + TF + JP;
            return RESULT_TYPES.find(t => t.code === typeCode) || RESULT_TYPES[0];
        }

        // 渲染结果页
        async function renderResult() {
            const type = finalType;
            
            let resultHtml = `
                <div id="resultCard" class="w-full bg-base-100/80 backdrop-blur-xl rounded-3xl p-6 md:p-10 shadow-2xl border border-base-200 animate-fade-in">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-48 h-48 md:w-64 md:h-64 mb-6 rounded-full overflow-hidden border-4 border-primary shadow-xl avatar-placeholder" style="background: ${type.avatarColor}">
                            <span class="text-7xl md:text-8xl">${type.avatarEmoji}</span>
                        </div>
                        
                        <h2 class="text-4xl md:text-5xl font-extrabold text-primary mb-2">${type.name}</h2>
                        <p class="text-xl text-base-content/70 mb-2">「${type.subtitle}」</p>
                        <div class="badge badge-lg badge-outline mb-6">${type.code}</div>
                        
                        <div class="w-full max-w-2xl bg-base-200/50 rounded-2xl p-6 mb-8">
                            <p class="text-lg leading-relaxed text-base-content">${type.description}</p>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl mb-8">
                            <div class="stat bg-base-200/50 rounded-box p-4">
                                <div class="stat-title">直男指数</div>
                                <div class="stat-value text-primary">${type.traits.straightScore}%</div>
                                <div class="stat-desc">${type.traits.straightComment}</div>
                            </div>
                            <div class="stat bg-base-200/50 rounded-box p-4">
                                <div class="stat-title">情商潜力</div>
                                <div class="stat-value text-secondary">${type.traits.eqScore}%</div>
                                <div class="stat-desc">${type.traits.eqComment}</div>
                            </div>
                        </div>
                        
                        <div class="flex flex-wrap gap-4 justify-center">
                            <button id="shareBtn" class="btn btn-primary btn-wide">📤 生成图片分享</button>
                            <button id="retakeBtn" class="btn btn-outline btn-wide">🔄 重新测试</button>
                        </div>
                        
                        <p class="text-sm text-base-content/40 mt-8">* 测试结果仅供娱乐，不要太当真。毕竟，每个直男都是潜力股。</p>
                    </div>
                </div>
            `;
            
            app.innerHTML = resultHtml;
            
            document.getElementById('retakeBtn').addEventListener('click', () => {
                currentView = 'home';
                currentQuestionIndex = 0;
                answers = [];
                finalType = null;
                renderHome();
            });
            
            document.getElementById('shareBtn').addEventListener('click', async () => {
                const btn = document.getElementById('shareBtn');
                btn.innerHTML = '⏳ 生成中...';
                btn.disabled = true;
                try {
                    const element = document.getElementById('resultCard');
                    element.classList.add('bg-base-100');
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        backgroundColor: '#1e293b',
                        allowTaint: true,
                        useCQRS: true,
                    });
                    element.classList.remove('bg-base-100');
                    const link = document.createElement('a');
                    link.download = `BroTi-${type.code}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.innerHTML = '✅ 已保存图片';
                    setTimeout(() => {
                        btn.innerHTML = '📤 生成图片分享';
                        btn.disabled = false;
                    }, 2000);
                } catch (error) {
                    console.error(error);
                    alert('生成图片失败，可尝试截图保存。');
                    btn.innerHTML = '📤 生成图片分享';
                    btn.disabled = false;
                }
            });
        }

        // 启动应用
        renderHome();
    </script>
</body>
</html>
