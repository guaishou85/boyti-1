      FAKE: { code: 'FAKE', cn: '伪装者', desc: '习惯于隐藏真实自我，戴上面具社交。内心与外在表现可能有较大差异。',

        vec: { S1: 5, S2: 4, S3: 5, E1: 5, E2: 5, E3: 5, A1: 6, A2: 6, A3: 5, Ac1: 4, Ac2: 4, Ac3: 4, So1: 5, So2: 5, So3: 5 } },
      OVER: { code: 'OVER', cn: '过度思考者', desc: '想太多，容易陷入思绪漩涡。分析能力很强，但有时过度思考导致行动力不足。',
        vec: { S1: 5, S2: 7, S3: 6, E1: 4, E2: 5, E3: 5, A1: 5, A2: 6, A3: 6, Ac1: 5, Ac2: 6, Ac3: 4, So1: 4, So2: 5, So3: 5 } },
      NEED: { code: 'NEED', cn: '需求者', desc: '需要他人的认可和支持。从外界获得能量，重视人际关系。',
        vec: { S1: 5, S2: 5, S3: 6, E1: 4, E2: 7, E3: 3, A1: 6, A2: 5, A3: 6, Ac1: 5, Ac2: 5, Ac3: 5, So1: 6, So2: 6, So3: 7 } },
      REAL: { code: 'REAL', cn: '真实者', desc: '做真实的自己，不伪装。言行一致，表里如一，活得坦诚。',
        vec: { S1: 7, S2: 8, S3: 8, E1: 6, E2: 6, E3: 6, A1: 7, A2: 6, A3: 7, Ac1: 6, Ac2: 6, Ac3: 6, So1: 6, So2: 5, So3: 6 } }
    };
    
    // 饮酒人格类型
    const drinkTypes = {
      SOBE: { code: 'SOBE', cn: '清醒者', desc: '保持清醒，不被欲望左右。有着超乎常人的自制力和定力。' },
      DRNK: { code: 'DRNK', cn: '饮酒者', desc: '借酒消愁愁更愁。饮酒是你面对世界的方式。' },
      SIMP: { code: 'SIMP', cn: '纯爱战士', desc: '为爱冲锋陷阵，不计后果。情感浓烈，容易陷得太深。' },
      LOSR: { code: 'LOSR', cn: '屌丝', desc: '自嘲自黑的乐天派。表面摆烂，内心仍有期待。' },
      IDOT: { code: 'IDOT', cn: '傻乐', desc: '简单快乐，想得少睡得好。活在当下，不为明天焦虑。' }
    };

    // 类型图片（占位符，可自行替换）
    const TYPE_IMAGES = {
      CTRL: 'https://picsum.photos/seed/ctrl/600/400',
      FLEX: 'https://picsum.photos/seed/flex/600/400',
      DEPP: 'https://picsum.photos/seed/depp/600/400',
      MASK: 'https://picsum.photos/seed/mask/600/400',
      CYNI: 'https://picsum.photos/seed/cyni/600/400',
      HOPE: 'https://picsum.photos/seed/hope/600/400',
      SHIT: 'https://picsum.photos/seed/shit/600/400',
      LONE: 'https://picsum.photos/seed/lone/600/400',
      HIDE: 'https://picsum.photos/seed/hide/600/400',
      SEEK: 'https://picsum.photos/seed/seek/600/400',
      CARE: 'https://picsum.photos/seed/care/600/400',
      PLAY: 'https://picsum.photos/seed/play/600/400',
      PLAN: 'https://picsum.photos/seed/plan/600/400',
      REBL: 'https://picsum.photos/seed/rebl/600/400',
      SAFE: 'https://picsum.photos/seed/safe/600/400',
      PESS: 'https://picsum.photos/seed/pess/600/400',
      FIGH: 'https://picsum.photos/seed/figh/600/400',
      GIVE: 'https://picsum.photos/seed/give/600/400',
      PERF: 'https://picsum.photos/seed/perf/600/400',
      DGAF: 'https://picsum.photos/seed/dgaf/600/400',
      LOST: 'https://picsum.photos/seed/lost/600/400',
      FAKE: 'https://picsum.photos/seed/fake/600/400',
      CLUE: 'https://picsum.photos/seed/clue/600/400',
      OVER: 'https://picsum.photos/seed/over/600/400',
      NEED: 'https://picsum.photos/seed/need/600/400',
      REAL: 'https://picsum.photos/seed/real/600/400',
      SOBE: 'https://picsum.photos/seed/sobe/600/400',
      DRNK: 'https://picsum.photos/seed/drnk/600/400',
      SIMP: 'https://picsum.photos/seed/simp/600/400',
      LOSR: 'https://picsum.photos/seed/losr/600/400',
      IDOT: 'https://picsum.photos/seed/idot/600/400'
    };

    const app = { answers: {}, shuffledQuestions: [], previewMode: false };
    const loading = document.getElementById('loading');

    // ===== 工具函数 =====
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getOptionText(qid, val) {
      const map = {
        q1: ['不认同', '中立', '认同'], q2: ['不认同', '中立', '认同'], q3: ['不认同', '中立', '认同'],
        q4: ['不认同', '中立', '认同'], q5: ['不认同', '中立', '认同'], q6: ['不认同', '中立', '认同'],
        q7: ['不认同', '中立', '认同'], q8: ['不认同', '中立', '认同'], q9: ['并没有', '也许？', '是的！'],
        q10: ['就算ta再优秀我也不会陷入太深', '介于两者之间', '会非常珍惜ta'],
        q11: ['那很爽了', '都行无所谓', '更喜欢保留独立空间'],
        q12: ['更喜欢依赖与被依赖', '看情况', '是的！'],
        q13: ['不认同', '中立', '认同'], q14: ['不认同', '中立', '认同'], q15: ['不认同', '中立', '认同'],
        q16: ['认同', '保持中立', '不认同'], q17: ['不认同', '中立', '认同'], q18: ['认同', '中立', '不认同'],
        q19: ['不认同', '中立', '认同'], q20: ['被逼到最后确实执行力超强', '有时候吧', '事情本该被推进'],
        q21: ['不认同', '中立', '认同'], q22: ['选A', '选B', '选C'],
        q23: ['邪恶的人心更多', '也许吧', '好人更多'], q24: ['隐瞒了我', '摇摆', '真的不舒服'],
        q25: ['真见面有点忐忑', '能聊就聊', '打扮一番热情聊天'], q26: ['保持距离', '能玩就玩', '热情聊天'],
        q27: ['认同', '中立', '不认同'], q28: ['不认同', '中立', '认同'],
        q29: ['情况较少', '碍于情面', '不想让人知道'], q30: ['不认同', '中立', '认同']
      };
      return map[qid]?.[val - 1] || '';
    }

    // ===== 渲染函数 =====
    function renderQuestions() {
      const container = document.getElementById('questionList');
      container.innerHTML = app.shuffledQuestions.map((q, idx) => {
        const qnum = idx + 1;
        const isSpecial = q.dim === 'special';
        const badge = isSpecial ? '补充题' : `第 ${qnum} 题`;
        const meta = isSpecial ? '维度已隐藏' : (dimensionMeta[q.dim]?.model || '维度已隐藏');
        
        let optionsHtml = '';
        if (isSpecial) {
          const opts = q.id === 'drink_q1' 
            ? ['吃喝拉撒', '艺术爱好', '饮酒', '健身']
            : ['小酌', '买醉', '来者不拒', '只喝白的', '有酒必喝'];
          const codes = ['A', 'B', 'C', 'D', 'E'];
          optionsHtml = opts.map((opt, i) => `
            <label class="option-item flex items-center gap-4 p-4 border-2 border-gray-200 rounded-xl cursor-pointer">
              <input type="radio" name="${q.id}" value="${i + 1}" class="radio radio-primary radio-lg">
              <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary font-bold flex items-center justify-center">${codes[i]}</div>
              <div class="text-gray-700">${opt}</div>
            </label>
          `).join('');
        } else {
          const codes = ['A', 'B', 'C'];
          const texts = [getOptionText(q.id, 1), getOptionText(q.id, 2), getOptionText(q.id, 3)];
          optionsHtml = texts.map((text, i) => `
            <label class="option-item flex items-center gap-4 p-4 border-2 border-gray-200 rounded-xl cursor-pointer">
              <input type="radio" name="${q.id}" value="${i + 1}" class="radio radio-primary radio-lg">
              <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary font-bold flex items-center justify-center">${codes[i]}</div>
              <div class="text-gray-700">${text}</div>
            </label>
          `).join('');
        }

        return `
          <div class="bg-white rounded-2xl p-6 mb-4 border border-gray-100 shadow-sm">
            <div class="flex justify-between items-center mb-4">
              <div class="badge badge-primary">${badge}</div>
              <div class="text-gray-400 text-sm">${meta}</div>
            </div>
            <h5 class="text-lg font-medium text-gray-800 mb-5">${q.text}</h5>
            <div class="space-y-3">${optionsHtml}</div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', updateProgress);
      });
      updateProgress();
    }

    function updateProgress() {
      const total = app.shuffledQuestions.length;
      let answered = 0;
      app.shuffledQuestions.forEach(q => {
        const name = q.dim === 'special' ? q.id : q.id;
        const selected = document.querySelector(`input[name="${name}"]:checked`);
        if (selected) {
          app.answers[name] = parseInt(selected.value);
          answered++;
        }
      });
      const pct = Math.round((answered / total) * 100);
      document.getElementById('progressBar').value = pct;
      document.getElementById('progressText').textContent = `${answered} / ${total}`;
      
      // 禁用/启用提交按钮
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = answered < total;
    }

    function computeResult() {
      const dimScores = {}; dimensionOrder.forEach(d => dimScores[d] = 0);
      const dimCounts = {}; dimensionOrder.forEach(d => dimCounts[d] = 0);

      app.shuffledQuestions.forEach(q => {
        if (q.dim === 'special') return;
        const val = app.answers[q.id];
        if (val) { dimScores[q.dim] += val; dimCounts[q.dim]++; }
      });

      const rawScores = {};
      dimensionOrder.forEach(d => {
        const avg = dimCounts[d] > 0 ? dimScores[d] / dimCounts[d] : 2;
        rawScores[d] = Math.round(avg * 3.33);
      });

      const typeScores = [];
      for (const [key, type] of Object.entries(types)) {
        let distance = 0;
        dimensionOrder.forEach(d => {
          const diff = (rawScores[d] || 5) - (type.vec[d] || 5);
          distance += diff * diff;
        });
        const match = Math.max(0, Math.round(100 - Math.sqrt(distance) * 3));
        typeScores.push({ key, type, match });
      }
      typeScores.sort((a, b) => b.match - a.match);
      const bestNormal = typeScores[0];

      const drinkQ1 = app.answers['drink_q1'];
      let finalType = bestNormal.type, modeKicker = '你的主类型', 
          badge = `匹配度 ${bestNormal.match}%`, sub = '基于十五维度深度分析', special = false;

      if (drinkQ1 === 3) {
        special = true;
        const drinkQ2 = app.answers['drink_q2'] || 1;
        if (drinkQ2 === 1) finalType = drinkTypes.SOBE;
        else if (drinkQ2 === 2) finalType = drinkTypes.DRNK;
        else if (drinkQ2 === 3) finalType = drinkTypes.SIMP;
        else if (drinkQ2 === 4) finalType = drinkTypes.LOSR;
        else if (drinkQ2 === 5) finalType = drinkTypes.IDOT;
        modeKicker = '饮酒专属类型';
        badge = '怎么样，被我拿捏了吧？';
        sub = '系统备注会显示在这里';
      }

      // 渲染结果
      document.getElementById('resultTypeName').textContent = `${finalType.code}（${finalType.cn}）`;
      document.getElementById('resultModeKicker').textContent = modeKicker;
      document.getElementById('resultTypeSub').textContent = sub;
      document.getElementById('matchBadge').textContent = badge;
      document.getElementById('resultDesc').textContent = finalType.desc;
      document.getElementById('posterImage').src = TYPE_IMAGES[finalType.code] || '';
      document.getElementById('posterCaption').textContent = `${finalType.cn}专属海报`;

      // 渲染维度评分
      const dimList = document.getElementById('dimList');
      dimList.innerHTML = dimensionOrder.map(d => `
        <div class="dimension-item bg-gray-50 rounded-xl p-4 border border-gray-100">
          <div class="flex justify-between items-center mb-2">
            <span class="font-medium text-gray-700">${dimensionMeta[d].name}</span>
            <span class="badge badge-primary">${rawScores[d] || 0}分</span>
          </div>
          <progress class="progress progress-primary w-full h-2" value="${(rawScores[d] || 0) * 10}" max="100"></progress>
          <p class="text-gray-400 text-sm mt-2 mb-0">${dimensionMeta[d].model}</p>
        </div>
      `).join('');

      // 友情提示
      document.getElementById('funNote').textContent = special 
        ? '饮酒有害健康，建议适量饮酒或不饮酒。本测试仅供娱乐，请勿当真。'
        : '测试结果仅供娱乐参考，不要过分迷信哦。每个人都是独一无二的个体。';
    }

    // ===== 事件监听 =====
    document.getElementById('startBtn').addEventListener('click', () => {
      // 准备题目
      const questions = rawQuestions.map((q, i) => ({ ...q, id: `q${i + 1}` }));
      app.shuffledQuestions = shuffle([...questions, ...specialQuestions]);
      renderQuestions();
      showScreen('test');
    });

    document.getElementById('backIntroBtn').addEventListener('click', () => {
      showScreen('intro');
    });

    document.getElementById('submitBtn').addEventListener('click', () => {
      loading.classList.add('active');
      setTimeout(() => {
        computeResult();
        loading.classList.remove('active');
        showScreen('result');
      }, 1500);
    });

    document.getElementById('toTopBtn').addEventListener('click', () => {
      showScreen('intro');
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      app.answers = {};
      const questions = rawQuestions.map((q, i) => ({ ...q, id: `q${i + 1}` }));
      app.shuffledQuestions = shuffle([...questions, ...specialQuestions]);
      renderQuestions();
      showScreen('test');
    });
  </script>
