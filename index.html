            height: 8px;
            border-radius: 20px;
            background-color: rgba(0,0,0,0.05);
        }
        [data-bs-theme="dark"] .progress-custom {
            background-color: rgba(255,255,255,0.1);
        }
        .badge-type {
            background: #e0e7ff;
            color: #3730a3;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;

            background: #312e81;
            color: #c7d2fe;
        }
        .btn-gradient {
            background: linear-gradient(145deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.9rem 2rem;
            border-radius: 60px;

        .btn-gradient:hover {
            background: linear-gradient(145deg, #4338ca, #6d28d9);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 14px 26px -8px #4f46e5;
        }
        .btn-outline-light-custom {
            border: 1.5px solid rgba(0,0,0,0.1);
            border-radius: 60px;
            padding: 0.9rem 2rem;
            font-weight: 500;
            background: transparent;
        }
        [data-bs-theme="dark"] .btn-outline-light-custom {
            border-color: rgba(255,255,255,0.2);

        }
        .footer-note {

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;

            background: white;
            border: none;

    </style>
</head>

            // 结果类型库 (头像用 Emoji + 渐变)
            const RESULT_TYPES = [
                { code: "ESTJ", name: "钢铁司令官", subtitle: "秩序守护者", description: "你天生就是当领导的料，做事雷厉风行，原则性强。你的直男癌指数不低，但靠谱程度极高。", traits: { straightScore: 88, straightComment: "直来直去", eqScore: 35, eqComment: "需要多哄哄" }, avatarEmoji: "👨‍✈️", avatarColor: "#3b5998" },

                { code: "ISFJ", name: "温柔守护者", subtitle: "默默付出型", description: "你就像一杯温水，不烫不凉，但最解渴。你的直男表现就是：永远在做事，永远不会说情话。", traits: { straightScore: 55, straightComment: "行动派", eqScore: 80, eqComment: "润物细无声" }, avatarEmoji: "🛡️", avatarColor: "#27ae60" },
                { code: "ESTP", name: "社交悍匪", subtitle: "全场最靓的仔", description: "你胆大心细，享受刺激，是聚会上最会玩的人。你的直男指数波动很大，取决于你当时的心情。", traits: { straightScore: 60, straightComment: "直率", eqScore: 75, eqComment: "见人说人话" }, avatarEmoji: "😎", avatarColor: "#f1c40f" },
                { code: "ISTP", name: "高冷手艺人", subtitle: "人狠话不多", description: "你是行走的工具箱，修电脑、换灯泡、组装家具无所不能。女朋友跟你抱怨工作累，你会直接问：“需要我给你重装系统吗？”", traits: { straightScore: 90, straightComment: "工具人属性", eqScore: 20, eqComment: "别让我猜" }, avatarEmoji: "🔧", avatarColor: "#7f8c8d" },
                { code: "ESFP", name: "人间小太阳", subtitle: "快乐源泉", description: "你是天生的表演家，有你的地方就有欢笑。直男？不存在的，你比女生还会玩。", traits: { straightScore: 15, straightComment: "姐妹相称", eqScore: 98, eqComment: "气氛组担当" }, avatarEmoji: "🎉", avatarColor: "#e84393" },
                { code: "ISFP", name: "文艺闷骚男", subtitle: "内心有片海", description: "你外表安静，内心却有着丰富的艺术细胞和感受力。直男指数极低，但容易陷入自己的小世界。", traits: { straightScore: 20, straightComment: "细腻敏感", eqScore: 85, eqComment: "懂得倾听" }, avatarEmoji: "🎨", avatarColor: "#6c5ce7" },
                { code: "ENTJ", name: "霸道总裁", subtitle: "天生的王者", description: "你有极强的野心和控制欲，目标明确，行动力爆表。你的直男癌是那种“我不要你觉得，我要我觉得”的类型。", traits: { straightScore: 85, straightComment: "霸道", eqScore: 40, eqComment: "爱你才管你" }, avatarEmoji: "👑", avatarColor: "#c0392b" },
                { code: "INTJ", name: "幕后黑手", subtitle: "独立思考者", description: "你是完美的策略家，理性、冷静、有远见。你的直男表现就是：用思维导图分析感情问题。", traits: { straightScore: 95, straightComment: "理智到冷漠", eqScore: 15, eqComment: "感情是啥" }, avatarEmoji: "♟️", avatarColor: "#2c3e50" },
                { code: "ENTP", name: "嘴强王者", subtitle: "逻辑鬼才", description: "你聪明、机智、热衷于辩论。虽然嘴欠，但脑子好使。", traits: { straightScore: 80, straightComment: "杠精本精", eqScore: 30, eqComment: "赢了道理输了人" }, avatarEmoji: "🤓", avatarColor: "#d35400" },
                { code: "INTP", name: "理论科学家", subtitle: "脑洞星人", description: "你生活在自己的逻辑世界里，对一切事物都充满好奇。你的直男表现堪称教科书级别的“不解风情”。", traits: { straightScore: 98, straightComment: "榆木疙瘩", eqScore: 10, eqComment: "注孤生潜力股" }, avatarEmoji: "🧪", avatarColor: "#8e44ad" },
                { code: "ENFJ", name: "灵魂导师", subtitle: "精神领袖", description: "你富有魅力，善于鼓舞人心。你是很多女生的“男闺蜜”，因为太懂她们了。", traits: { straightScore: 30, straightComment: "知心大哥", eqScore: 95, eqComment: "共情能力MAX" }, avatarEmoji: "📖", avatarColor: "#16a085" },
                { code: "INFJ", name: "神秘主义者", subtitle: "理想主义战士", description: "你有着深刻的洞察力和坚定的价值观。虽然看起来很直，但实际上心思细腻。", traits: { straightScore: 40, straightComment: "外冷内热", eqScore: 90, eqComment: "灵魂洞察者" }, avatarEmoji: "🔮", avatarColor: "#2980b9" },
                { code: "ENFP", name: "快乐小狗", subtitle: "社交牛逼症", description: "你热情、奔放、充满好奇心。直男？你比女生还感性。", traits: { straightScore: 10, straightComment: "感性动物", eqScore: 98, eqComment: "人见人爱" }, avatarEmoji: "🐶", avatarColor: "#f39c12" },
                { code: "INFP", name: "治愈系少年", subtitle: "永远的梦想家", description: "你温柔、善良、富有同情心。你的直男指数为零，因为你本身就是个需要被呵护的宝宝。", traits: { straightScore: 5, straightComment: "小仙男", eqScore: 99, eqComment: "人间天使" }, avatarEmoji: "🌸", avatarColor: "#9b59b6" }
            ];

            const app = document.getElementById('app');
            let currentView = 'home';        // 'home', 'quiz', 'result'
            let answers = {};                // { questionId: optionIndex }
            let finalType = null;

            // 主题切换
            const themeToggle = document.getElementById('themeToggle');
            themeToggle.addEventListener('click', () => {
                const body = document.body;
                const currentTheme = body.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                body.setAttribute('data-bs-theme', newTheme);
                themeToggle.innerHTML = newTheme === 'light' ? '<i class="bi bi-moon-stars-fill"></i>' : '<i class="bi bi-sun-fill"></i>';
                // 重新渲染当前视图以适配主题样式 (简单处理: 重新调用当前渲染)
                if (currentView === 'home') renderHome();
                else if (currentView === 'quiz') renderQuiz();
                else if (currentView === 'result') renderResult();
            });

            // 计算得分
            function calculateResult() {
                let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
                Object.entries(answers).forEach(([qid, optIdx]) => {
                    const q = QUESTION_BANK.find(q => q.id == qid);
                    if (!q) return;
                    const option = q.options[optIdx];
                    if (option && option.trait) {
                        scores[option.trait] += 1;
                    }
                });
                const EI = scores.E >= scores.I ? 'E' : 'I';
                const SN = scores.S >= scores.N ? 'S' : 'N';
                const TF = scores.T >= scores.F ? 'T' : 'F';
                const JP = scores.J >= scores.P ? 'J' : 'P';
                const typeCode = EI + SN + TF + JP;
                return RESULT_TYPES.find(t => t.code === typeCode) || RESULT_TYPES[0];
            }

            // 首页
            function renderHome() {
                const isDark = document.body.getAttribute('data-bs-theme') === 'dark';
                app.innerHTML = `
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <div class="card card-test p-4 p-md-5 text-center">
                                <div class="mb-4 display-1">🧔‍♂️</div>
                                <h1 class="display-5 fw-bold mb-3" style="color: ${isDark ? '#e0e7ff' : '#1e293b'}">
                                    你的直男人格是什么？
                                </h1>
                                <p class="lead mb-4" style="color: ${isDark ? '#b0c0e0' : '#475569'}">

                                <button id="startBtn" class="btn btn-gradient btn-lg px-5 py-3 mt-3">

                document.getElementById('startBtn').addEventListener('click', () => {
                    currentView = 'quiz';
                    answers = {};
                    renderQuiz();

            }

            // 答题页 (所有题目平铺)
            function renderQuiz() {
                const isDark = document.body.getAttribute('data-bs-theme') === 'dark';
                let questionsHtml = '';
                QUESTION_BANK.forEach((q, idx) => {
                    const selectedIdx = answers[q.id] !== undefined ? answers[q.id] : -1;
                    let optionsHtml = '';
                    q.options.forEach((opt, optIdx) => {
                        const selectedClass = (selectedIdx === optIdx) ? 'selected' : '';
                        optionsHtml += `
                            <button class="option-btn btn ${selectedClass}" data-qid="${q.id}" data-optindex="${optIdx}">
                                <span class="me-2 fw-bold">${String.fromCharCode(65 + optIdx)}.</span> ${opt.text}

                    });
                    questionsHtml += `
                        <div class="question-card">
                            <h5 class="fw-semibold mb-3">${idx+1}. ${q.text}</h5>
                            <div class="d-grid gap-2">
                                ${optionsHtml}
                            </div>
                        </div>
                    `;
                });

                const answeredCount = Object.keys(answers).length;
                const total = QUESTION_BANK.length;
                const progressPercent = (answeredCount / total) * 100;

                app.innerHTML = `
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <div class="card card-test p-4 p-md-5">
                                <div class="d-flex align-items-center justify-content-between mb-3">
                                    <h3 class="fw-bold mb-0" style="color: ${isDark ? '#e2e8f0' : '#1e293b'}">
                                        <i class="bi bi-pencil-square me-2"></i>答题卡
                                    </h3>
                                    <span class="badge rounded-pill px-4 py-2" style="background: ${isDark ? '#312e81' : '#e0e7ff'}; color: ${isDark ? '#c7d2fe' : '#3730a3'}">
                                        ${answeredCount}/${total} 题
                                    </span>
                                </div>
                                <div class="progress progress-custom mb-4">
                                    <div class="progress-bar bg-primary" role="progressbar" style="width: ${progressPercent}%;" aria-valuenow="${progressPercent}" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                                
                                <div id="questionsContainer">
                                    ${questionsHtml}
                                </div>
                                
                                <div class="d-grid mt-4">
                                    <button id="submitQuizBtn" class="btn btn-gradient btn-lg py-3">
                                        查看结果 <i class="bi bi-bar-chart-fill ms-2"></i>
                                    </button>
                                </div>
                                <button id="backHomeBtn" class="btn btn-link text-secondary mt-3">
                                    <i class="bi bi-arrow-left"></i> 返回首页
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                // 绑定选项点击事件
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const qid = parseInt(btn.dataset.qid);
                        const optIndex = parseInt(btn.dataset.optindex);
                        answers[qid] = optIndex;
                        // 重新渲染更新高亮
                        renderQuiz();
                    });
                });

                document.getElementById('submitQuizBtn').addEventListener('click', () => {
                    if (Object.keys(answers).length < QUESTION_BANK.length) {
                        alert(`你还有 ${QUESTION_BANK.length - Object.keys(answers).length} 道题未回答，请全部完成后再查看结果。`);
                        return;
                    }
                    finalType = calculateResult();
                    currentView = 'result';
                    renderResult();
                });

                document.getElementById('backHomeBtn').addEventListener('click', () => {
                    currentView = 'home';
                    renderHome();
                });
            }

            // 结果页
            async function renderResult() {
                const type = finalType;
                const isDark = document.body.getAttribute('data-bs-theme') === 'dark';
                
                app.innerHTML = `
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <div id="resultCard" class="card card-test p-4 p-md-5 text-center">
                                <div class="result-avatar" style="background: radial-gradient(circle at 30% 30%, ${type.avatarColor}dd, ${type.avatarColor}99);">
                                    <span class="display-3">${type.avatarEmoji}</span>
                                </div>
                                <h2 class="fw-bold mb-2" style="color: ${isDark ? '#f1f5f9' : '#0f172a'}">${type.name}</h2>
                                <p class="fs-5 text-secondary mb-3">「${type.subtitle}」</p>
                                <span class="badge-type mb-4">${type.code}</span>
                                
                                <div class="bg-light bg-opacity-25 p-4 rounded-4 mb-4" style="background: ${isDark ? '#1e293b' : '#f8fafc'}">
                                    <p class="lead mb-0">${type.description}</p>
                                </div>
                                
                                <div class="row g-3 mb-4">
                                    <div class="col-6">
                                        <div class="p-3 rounded-4 h-100" style="background: ${isDark ? '#1e293b' : '#f1f5f9'}">
                                            <div class="text-secondary small">直男指数</div>
                                            <div class="display-6 fw-bold text-primary">${type.traits.straightScore}%</div>
                                            <div class="small">${type.traits.straightComment}</div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-3 rounded-4 h-100" style="background: ${isDark ? '#1e293b' : '#f1f5f9'}">
                                            <div class="text-secondary small">情商潜力</div>
                                            <div class="display-6 fw-bold text-success">${type.traits.eqScore}%</div>
                                            <div class="small">${type.traits.eqComment}</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="d-flex flex-wrap gap-3 justify-content-center">
                                    <button id="shareBtn" class="btn btn-gradient px-4 py-2">
                                        <i class="bi bi-download me-2"></i>保存结果卡片
                                    </button>
                                    <button id="retakeBtn" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                                        <i class="bi bi-arrow-repeat me-2"></i>重新测试
                                    </button>
                                </div>
                                <p class="footer-note small mt-4">* 测试结果仅供娱乐，每个直男都是潜力股。</p>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('retakeBtn').addEventListener('click', () => {
                    currentView = 'home';
                    answers = {};
                    finalType = null;
                    renderHome();
                });

                document.getElementById('shareBtn').addEventListener('click', async () => {
                    const btn = document.getElementById('shareBtn');
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>生成中...';
                    btn.disabled = true;
                    try {
                        const element = document.getElementById('resultCard');
                        // 临时添加纯色背景防止透明
                        element.style.background = isDark ? '#192132' : '#ffffff';
                        const canvas = await html2canvas(element, {
                            scale: 2.2,
                            backgroundColor: isDark ? '#192132' : '#ffffff',
                            allowTaint: true,
                            useCQRS: true,
                        });
                        element.style.background = '';
                        const link = document.createElement('a');
                        link.download = `BroTi-${type.code}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        btn.innerHTML = '<i class="bi bi-check-lg me-2"></i>已保存';
                        setTimeout(() => {
                            btn.innerHTML = '<i class="bi bi-download me-2"></i>保存结果卡片';
                            btn.disabled = false;
                        }, 2000);
                    } catch (error) {
                        console.error(error);
                        alert('生成图片失败，可尝试截图保存。');
                        btn.innerHTML = '<i class="bi bi-download me-2"></i>保存结果卡片';
                        btn.disabled = false;
                    }
                });
            }

            // 启动首页
            renderHome();
        })();
    </script>
</body>
</html>
